[project]
name = "icloud-mcp-macos"
version = "0.1.0b1"
description = "Single-owner iCloud MCP for Mail, Calendar, Contacts and macOS EventKit Reminders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "iCloud MCP for macOS contributors" }]
keywords = ["mcp", "model-context-protocol", "icloud", "apple", "chatgpt", "claude", "imap", "caldav", "carddav", "email", "calendar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=2.2,<3",
    "imapclient>=3.0",
    "caldav>=3.3",
    "icalendar>=6.1",
    "html2text>=2024.2.26",
    "python-dateutil>=2.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosmtpd>=1.4", "radicale>=3.2"]

[project.urls]
Homepage = "https://github.com/AlexVrg71/icloud-mcp-macos"
Issues = "https://github.com/AlexVrg71/icloud-mcp-macos/issues"
Security = "https://github.com/AlexVrg71/icloud-mcp-macos/security/policy"

[project.scripts]
icloud-mcp-macos = "icloud_mcp.server:main"
icloud-mcp = "icloud_mcp.server:main"
icloud-mcp-server = "icloud_mcp.server:main"          # compatibility alias inherited from upstream
icloud-mcp-selftest = "icloud_mcp.selftest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icloud_mcp = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
